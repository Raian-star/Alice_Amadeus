name: Enviar Relatorio Alice

on:
  schedule:
    # Roda todo DOMINGO às 23:00 UTC (20:00 no horário de Brasília)
    - cron: '0 23 * * 0'
  workflow_dispatch: # Permite disparar o teste manual a qualquer momento via botão

jobs:
  enviar_relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          pip install pandas supabase pyTelegramBotAPI reportlab openpyxl

      - name: Executar Script do Relatorio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_MY_CHAT_ID: ${{ secrets.TELEGRAM_MY_CHAT_ID }}
        run: python cron_job.py